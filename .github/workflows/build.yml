name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Write Google credentials
        shell: pwsh
        run: |
          '${{ secrets.GDRIVE_CREDENTIALS_JSON }}' | Out-File -FilePath resources\google_drive_config\credentials.json -Encoding utf8 -NoNewline

      - name: Build Windows installer
        run: npm run build:win

      - name: List all exe files (debug)
        run: Get-ChildItem -Recurse -Include *.exe | Select-Object FullName
        shell: pwsh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: docutrack-installer
          path: |
            dist/*.exe
          if-no-files-found: warn
