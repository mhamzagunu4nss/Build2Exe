<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Loading DocuTrack...</title>
    <style>
      body {
        background-color: #1e1e1e;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        font-family: sans-serif;
        user-select: none;
        overflow: hidden;
      }
      .logo-container {
        position: relative;
        width: 8rem;
        height: 8rem;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.25rem;
      }
      .spinner {
        position: absolute;
        inset: 0;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      img {
        width: 8rem;
        height: 8rem;
        object-fit: contain;
      }
      h2 {
        font-size: 0.875rem;
        font-weight: 500;
        letter-spacing: 0.05em;
        color: #d1d5db;
      }
    </style>
  </head>
  <body>
    <div class="logo-container">
      <div class="spinner"></div>
      <img src="./mosr-logo.png" alt="Logo" />
    </div>
    <h2>DocuTrack is starting...</h2>
  </body>
</html>
